name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r requirements-dev.txt
      - name: Tests (unit, API, attestation, SDK)
        run: pytest --cov=humanproof --cov-report=term-missing --cov-fail-under=80
      - name: Static analysis (bandit)
        run: bandit -q -r humanproof tools -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt --strict

  motor-model:
    # Retrains the motor model from real public data so the shipped model is reproducible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r ml/requirements.txt -r backend/requirements.txt
      - run: git clone --depth 1 https://github.com/prativa-97/Mouse-Dynamics /tmp/iitkgp
      - run: python ml/motor/train.py --iitkgp /tmp/iitkgp --out /tmp/models
      - uses: actions/upload-artifact@v4
        with: { name: motor-model, path: /tmp/models }

  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run prepare-assets
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --omit=dev --audit-level=high
