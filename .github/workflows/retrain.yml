# Retrains the eye and movement models from the labelled sessions the app has
# collected, and opens a pull request only when a new model is measurably better
# than the one in the repository. Nothing goes live until that pull request is merged.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions), with
# the same values the deployment uses:
#   HP_DATABASE_URL   Postgres connection string
#   HP_MASTER_SECRET  the key the stored samples are encrypted with
# and Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests" switched on.
#
# The decrypted dataset exists only on the runner's temporary disk for the length
# of the job. It is never uploaded as an artefact and never committed.
name: Retrain models

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      report_only:
        description: "Report only: measure, but never change a model or open a pull request"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPORT_DIR: ${{ runner.temp }}/hp-export
      REPORT: ${{ runner.temp }}/retrain-report.md
    steps:
      - uses: actions/checkout@v4

      - name: Check that the secrets are set
        id: cfg
        env:
          HAS_DB: ${{ secrets.HP_DATABASE_URL != '' }}
          HAS_KEY: ${{ secrets.HP_MASTER_SECRET != '' }}
        run: |
          if [ "$HAS_DB" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Retraining skipped"
              echo "Add the repository secrets \`HP_DATABASE_URL\` and \`HP_MASTER_SECRET\` (the same values the deployment uses)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            humanproof/backend/requirements-dev.txt
            humanproof/ml/requirements.txt

      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: pip install -r humanproof/backend/requirements-dev.txt -r humanproof/ml/requirements.txt

      - name: Fetch the public mouse recordings
        if: steps.cfg.outputs.ready == 'true'
        run: git clone --depth 1 https://github.com/prativa-97/Mouse-Dynamics "$RUNNER_TEMP/Mouse-Dynamics"

      # The only step that sees the database and the key.
      - name: Export the collected sessions
        if: steps.cfg.outputs.ready == 'true'
        env:
          HP_DATABASE_URL: ${{ secrets.HP_DATABASE_URL }}
          HP_MASTER_SECRET: ${{ secrets.HP_MASTER_SECRET }}
        run: python humanproof/ml/dataset/export.py --out "$EXPORT_DIR"

      - name: Retrain and compare
        if: steps.cfg.outputs.ready == 'true'
        run: |
          python humanproof/ml/retrain.py \
            --data "$EXPORT_DIR" \
            --iitkgp "$RUNNER_TEMP/Mouse-Dynamics" \
            --models humanproof/backend/models \
            --report "$REPORT" \
            ${{ inputs.report_only && '--dry-run' || '' }} > /dev/null
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the decrypted dataset
        if: always()
        run: rm -rf "$EXPORT_DIR"

      - name: See whether a model changed
        if: steps.cfg.outputs.ready == 'true'
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- humanproof/backend/models)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No model changed; nothing to review." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the server tests against the new models
        if: steps.diff.outputs.changed == 'true'
        working-directory: humanproof/backend
        env:
          HP_IITKGP_DATA: ${{ runner.temp }}/Mouse-Dynamics # also checks the model on real held-out people
        run: python -m pytest -p no:warnings

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="retrain/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add humanproof/backend/models
          git commit -m "Retrain models from collected sessions"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Retrained models ($(date -u +%Y-%m-%d))" --body-file "$REPORT"
